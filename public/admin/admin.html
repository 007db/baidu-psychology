<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>摆渡心理 V9.0 企业后台</title>
<style>
body{font-family:Arial;padding:20px;background:#f5f7fb}
.card{display:inline-block;background:white;padding:20px;margin:10px;border-radius:12px}
table{width:100%;background:white;border-collapse:collapse;margin:20px 0}
td,th{padding:10px;border:1px solid #ddd}
button{padding:6px}
</style>
</head>
<body>
<h1>🧠 摆渡心理 V9.0 企业管理后台</h1>

<div id="stats"></div>

<h2>预约管理</h2>
<table>
<thead><tr><th>ID</th><th>客户</th><th>咨询师</th><th>状态</th><th>操作</th></tr></thead>
<tbody id="appointments"></tbody>
</table>

<h2>客户档案</h2>
<table>
<thead><tr><th>ID</th><th>姓名</th><th>电话</th><th>备注</th></tr></thead>
<tbody id="clients"></tbody>
</table>

<h2>咨询记录</h2>
<table>
<thead><tr><th>ID</th><th>标题</th><th>内容</th></tr></thead>
<tbody id="records"></tbody>
</table>

<script src="enterprise.js"></script>
</body>
</html>
