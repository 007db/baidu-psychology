<!doctype html><html><body><h2>会员登录</h2><input id="email"><input id="password"><button onclick="login()">登录</button><script>async function login(){alert(await (await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})})).text())}</script></body></html>
