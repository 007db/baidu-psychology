<!doctype html>
<html><body>
<h2>DeepSeek AI心理助手</h2>
<textarea id="msg" placeholder="请输入你的困扰"></textarea>
<button onclick="send()">发送</button>
<div id="out"></div>
<script>
async function send(){
 let r=await fetch('/api/chat',{
 method:'POST',
 headers:{'Content-Type':'application/json'},
 body:JSON.stringify({message:msg.value})
 });
 out.innerHTML=await r.text();
}
</script>
</body></html>
