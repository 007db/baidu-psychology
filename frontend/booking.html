<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>预约咨询</title><link rel="stylesheet" href="style.css"></head>
<body>
<h1>心理咨询预约</h1>
<form id="booking">
<input id="name" placeholder="姓名"><br>
<input id="phone" placeholder="手机号"><br>
<input id="service" placeholder="咨询类型"><br>
<button>提交预约</button>
</form>
<script>
document.querySelector('#booking').onsubmit=async(e)=>{
e.preventDefault();
await fetch('/api/booking',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
name:name.value,phone:phone.value,service:service.value
})});
alert('预约提交成功');
}
</script>
</body></html>
