<!DOCTYPE html>
<html><body>
<img src="/assets/logo.png" width="160">
<h1>在线预约</h1>
<input id="name" placeholder="姓名"><br>
<input id="phone" placeholder="电话"><br>
<input id="service" placeholder="服务类型"><br>
<textarea id="message" placeholder="留言"></textarea><br>
<button onclick="submitBook()">提交</button>
<script>
async function submitBook(){
let r=await fetch('/api/booking',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
name:name.value,
phone:phone.value,
type:service.value,
message:message.value
})
});
alert(await r.text());
}
</script>
</body></html>
