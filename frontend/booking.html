<h1>在线预约</h1><input id="name" placeholder="姓名"><input id="phone" placeholder="电话"><button onclick="go()">提交</button><script>async function go(){await fetch('/api/booking',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value,phone:phone.value})});alert('提交成功')}</script>
