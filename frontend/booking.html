<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>摆渡心理 - 在线预约</title>


<style>

body{

font-family:"Microsoft YaHei",sans-serif;

background:#f5f9ff;

margin:0;

padding:40px;

}


.container{

max-width:500px;

margin:auto;

background:white;

padding:30px;

border-radius:15px;

box-shadow:0 5px 20px rgba(0,0,0,.1);

}


h1{

text-align:center;

color:#005b8f;

}


input,select,textarea{

width:100%;

padding:12px;

margin-top:15px;

border:1px solid #ccc;

border-radius:8px;

font-size:16px;

box-sizing:border-box;

}


textarea{

height:100px;

}


button{

width:100%;

margin-top:20px;

padding:14px;

background:#006fa6;

color:white;

border:none;

border-radius:30px;

font-size:18px;

cursor:pointer;

}


button:hover{

background:#005580;

}


#msg{

text-align:center;

margin-top:20px;

color:#006fa6;

}

</style>


</head>


<body>


<div class="container">


<h1>在线预约</h1>


<input 
id="name"
placeholder="请输入姓名">


<input 
id="phone"
placeholder="请输入联系方式">


<select id="type">

<option value="情绪压力咨询">
情绪压力咨询
</option>


<option value="婚恋关系咨询">
婚恋关系咨询
</option>


<option value="青少年心理">
青少年心理
</option>


<option value="职场成长咨询">
职场成长咨询
</option>


</select>


<input
id="time"
placeholder="请输入预约时间，例如：2026-08-05 15:00">


<textarea
id="message"
placeholder="请输入您的留言">
</textarea>


<button onclick="submitBooking()">

提交预约

</button>


<div id="msg"></div>


</div>



<script>


async function submitBooking(){



let data={


name:
document.getElementById("name").value,


phone:
document.getElementById("phone").value,


type:
document.getElementById("type").value,


appointment_time:
document.getElementById("time").value,


message:
document.getElementById("message").value


};



if(!data.name){

alert("请输入姓名");

return;

}



try{


let res = await fetch(

"/api/booking",

{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify(data)

}

);



let result = await res.json();



if(result.success){


document.getElementById("msg").innerHTML=

"预约提交成功，我们会尽快联系您";


}

else{


document.getElementById("msg").innerHTML=

"提交失败："+result.message;


}



}

catch(error){


console.error(error);


document.getElementById("msg").innerHTML=

"网络错误，请稍后再试";


}



}


</script>


</body>

</html>
