<!doctype html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>摆渡心理 - 在线预约</title>


<style>

body{

margin:0;

font-family:
"Microsoft YaHei",
Arial;

background:#f3f9ff;

}


.container{

max-width:650px;

margin:30px auto;

padding:20px;

}


h1{

text-align:center;

color:#0077c8;

}



.card{

background:white;

padding:25px;

border-radius:16px;

box-shadow:
0 5px 20px rgba(0,0,0,.08);

}



label{

display:block;

margin-top:15px;

color:#333;

}



input,
select,
textarea{


width:100%;

box-sizing:border-box;

margin-top:8px;

padding:12px;

border-radius:8px;

border:1px solid #ccc;

font-size:15px;

}



textarea{

height:100px;

resize:none;

}



button{


margin-top:20px;

width:100%;

padding:14px;

background:#0077c8;

color:white;

border:none;

border-radius:10px;

font-size:17px;

cursor:pointer;


}



button:hover{

background:#005fa3;

}



.result{

margin-top:20px;

text-align:center;

font-size:16px;

}



.hotline{

text-align:center;

margin-top:25px;

}



.hotline a{

color:#e53935;

font-weight:bold;

text-decoration:none;

}



</style>

</head>


<body>


<div class="container">


<h1>
摆渡心理 在线预约
</h1>


<div class="card">


<form id="form">


<label>
姓名
</label>

<input 
id="name"
required
placeholder="请输入姓名">


<label>
联系电话
</label>

<input
id="phone"
required
placeholder="请输入手机号">


<label>
微信号（可选）
</label>

<input
id="wechat"
placeholder="请输入微信号">


<label>
咨询类型
</label>


<select id="type">


<option>
情绪压力
</option>


<option>
婚恋关系
</option>


<option>
青少年成长
</option>


<option>
职场压力
</option>


<option>
其他
</option>


</select>



<label>
预约日期
</label>


<input
type="date"
id="date">



<label>
预约时间
</label>


<select id="time">

<option>
上午 9:00-12:00
</option>


<option>
下午 14:00-18:00
</option>


<option>
晚上 19:00-22:00
</option>


</select>



<label>
留言说明
</label>


<textarea
id="message"
placeholder="请简单描述您的情况">
</textarea>



<button type="submit">

提交预约

</button>


</form>



<div id="result" class="result"></div>


</div>



<div class="hotline">

心理危机干预热线：

<br>

<a href="tel:4000071995">

400 007 1995

</a>


</div>


</div>




<script>


document
.getElementById("form")
.addEventListener(
"submit",
async function(e){


e.preventDefault();



const result =
document.getElementById("result");


result.innerHTML =
"正在提交，请稍候...";



try{


const res =
await fetch(
"/api/booking",
{


method:"POST",


headers:{


"Content-Type":

"application/json"

},


body:JSON.stringify({


name:
document.getElementById("name").value,


phone:
document.getElementById("phone").value,


wechat:
document.getElementById("wechat").value,


type:
document.getElementById("type").value,


date:
document.getElementById("date").value,


time:
document.getElementById("time").value,


message:
document.getElementById("message").value


})


});



const data =
await res.json();



if(data.success){


result.innerHTML=

"✅ 预约提交成功，我们会尽快联系您";


document
.getElementById("form")
.reset();


}

else{


result.innerHTML=

"提交失败，请稍后重试";


}



}

catch(err){


result.innerHTML=

"网络错误，请稍后再试";


}



});


</script>



</body>

</html>
