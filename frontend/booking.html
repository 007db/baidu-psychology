<!doctype html>
<html><body>
<h1>在线预约</h1>
<input id="name" placeholder="姓名"><br>
<input id="phone" placeholder="电话"><br>
<textarea id="message" placeholder="咨询需求"></textarea><br>
<button onclick="submitBooking()">提交预约</button>
<p id="result"></p>
<script>
async function submitBooking(){
let r=await fetch('/api/booking',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
name:name.value,
phone:phone.value,
message:message.value
})
});
result.innerText=await r.text();
}
</script>
</body></html>
