<!doctype html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>摆渡心理在线预约</title>

<style>

body{
margin:0;
background:#f3f9ff;
font-family:"Microsoft YaHei",Arial;
}

.container{
max-width:650px;
margin:30px auto;
padding:20px;
}

h1{
text-align:center;
color:#0077c8;
}

.card{

background:#fff;
padding:25px;
border-radius:16px;
box-shadow:0 5px 20px rgba(0,0,0,.08);

}

input,
select,
textarea{

width:100%;
box-sizing:border-box;
padding:12px;
margin-top:8px;
border:1px solid #ccc;
border-radius:8px;
font-size:15px;

}


textarea{

height:100px;

}


label{

display:block;
margin-top:15px;

}


button{

width:100%;
margin-top:20px;
padding:14px;

background:#0077c8;

color:white;

border:0;

border-radius:10px;

font-size:17px;

}


#result{

text-align:center;
margin-top:20px;

}


.hotline{

margin-top:25px;

text-align:center;

}


.hotline a{

color:red;

font-weight:bold;

text-decoration:none;

}


</style>

</head>


<body>


<div class="container">


<h1>
摆渡心理 在线预约
</h1>


<div class="card">


<form id="bookingForm">


<label>姓名</label>

<input id="name" required>


<label>联系电话</label>

<input id="phone" required>


<label>微信号</label>

<input id="wechat">


<label>咨询类型</label>

<select id="type">

<option>情绪压力</option>

<option>婚恋关系</option>

<option>青少年成长</option>

<option>职场压力</option>

<option>其他</option>

</select>


<label>预约日期</label>

<input type="date" id="date">


<label>预约时间</label>

<select id="time">

<option>上午 9:00-12:00</option>

<option>下午 14:00-18:00</option>

<option>晚上 19:00-22:00</option>

</select>


<label>留言</label>

<textarea id="message"></textarea>


<button type="submit">
提交预约
</button>


</form>


<div id="result"></div>


</div>


<div class="hotline">

心理危机干预热线

<br>

<a href="tel:4000071995">
400 007 1995
</a>

</div>


</div>



<script>


document
.getElementById("bookingForm")
.addEventListener(
"submit",
async function(e){


e.preventDefault();


const result =
document.getElementById("result");


result.innerHTML="正在提交...";


try{


const response =
await fetch("/api/booking",{


method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

name:
name.value,

phone:
phone.value,

wechat:
wechat.value,

type:
type.value,

date:
date.value,

time:
time.value,

message:
message.value

})


});


const data =
await response.json();



if(data.success){

result.innerHTML=
"✅ 预约成功，我们会尽快联系您";


bookingForm.reset();


}else{


result.innerHTML=
data.error || "提交失败";


}



}catch(e){


result.innerHTML=
"网络异常，请稍后重试";


}



});


</script>


</body>

</html>
