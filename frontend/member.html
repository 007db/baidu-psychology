<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>会员中心</title></head>
<body>
<h1>会员中心</h1>
<input id="phone" placeholder="手机号">
<button onclick="load()">查询</button>
<div id="result"></div>
<script>
async function load(){
let r=await fetch('/api/member?phone='+phone.value);
result.innerHTML=await r.text();
}
</script>
</body></html>
