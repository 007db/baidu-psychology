<!doctype html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<title>摆渡心理管理员登录</title>


<style>

body{

background:#f3f9ff;

font-family:"Microsoft YaHei";

}


.box{

width:350px;

margin:100px auto;

background:white;

padding:30px;

border-radius:15px;

box-shadow:0 5px 20px #ddd;

}


h2{

text-align:center;

color:#0077c8;

}


input{

width:100%;

padding:12px;

margin:10px 0;

box-sizing:border-box;

}


button{

width:100%;

padding:12px;

background:#0077c8;

color:white;

border:0;

border-radius:8px;

font-size:16px;

}


#msg{

text-align:center;

margin-top:15px;

}

</style>


</head>


<body>


<div class="box">


<h2>
摆渡心理后台
</h2>


<input id="username" placeholder="管理员账号">


<input id="password" type="password" placeholder="密码">


<button onclick="login()">

登录

</button>


<div id="msg"></div>


</div>


<script>


async function login(){


const res =
await fetch(
"/api/admin-login",
{


method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

username:
username.value,

password:
password.value

})


});


const data =
await res.json();



if(data.success){


localStorage.setItem(
"admin",
JSON.stringify(data.user)
);


location.href="/admin";


}

else{


msg.innerHTML=data.message;


}


}


</script>


</body>

</html>
