<!doctype html><html><body>
<h2>管理员登录</h2>
<input id="username" placeholder="账号">
<input id="password" placeholder="密码">
<button onclick="login()">登录</button>
<script>
async function login(){
let r=await fetch('/api/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});
let d=await r.json();
if(d.success) location.href='admin-dashboard.html'; else alert('登录失败');
}
</script></body></html>
