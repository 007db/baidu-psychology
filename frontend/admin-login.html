<!doctype html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>摆渡心理管理员登录</title>


<style>

body{

margin:0;

background:#f3f9ff;

font-family:"Microsoft YaHei";

}


.box{

width:360px;

margin:100px auto;

background:white;

padding:30px;

border-radius:16px;

box-shadow:0 5px 20px #ddd;

}


h2{

text-align:center;

color:#0077c8;

}


input{

width:100%;

padding:12px;

margin-top:15px;

box-sizing:border-box;

border:1px solid #ccc;

border-radius:8px;

}


button{

margin-top:20px;

width:100%;

padding:14px;

background:#0077c8;

color:white;

border:0;

border-radius:8px;

font-size:16px;

}


#msg{

text-align:center;

margin-top:15px;

color:red;

}

</style>

</head>


<body>


<div class="box">


<h2>
摆渡心理后台登录
</h2>


<input id="username" placeholder="管理员账号">


<input id="password" type="password" placeholder="管理员密码">


<button onclick="login()">
登录
</button>


<div id="msg"></div>


</div>



<script>


async function login(){


const res = await fetch(
"/api/admin-login",
{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

username:
username.value,

password:
password.value

})

});


const data =
await res.json();



if(data.success){


localStorage.setItem(
"admin",
JSON.stringify(data.user)
);



location.href="/admin";


}else{


msg.innerText=data.message;


}


}


</script>


<script src="/assets/js/auth.js"></script>
</body>

</html>
