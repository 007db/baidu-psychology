<!doctype html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>
摆渡心理 - 咨询师工作台
</title>


<style>

body{

margin:0;

font-family:

"Microsoft YaHei",
Arial;

background:#f3f9ff;

color:#333;

}


.container{

max-width:1100px;

margin:30px auto;

padding:20px;

}



.header{

background:white;

padding:25px;

border-radius:16px;

box-shadow:
0 5px 20px rgba(0,0,0,.08);

display:flex;

justify-content:space-between;

align-items:center;

}



.logo{

font-size:24px;

font-weight:bold;

color:#0077c8;

}



.logout{

background:#e53935;

color:white;

border:none;

padding:10px 20px;

border-radius:8px;

cursor:pointer;

}



.card{

background:white;

margin-top:25px;

padding:25px;

border-radius:16px;

box-shadow:
0 5px 20px rgba(0,0,0,.08);

}



h2{

color:#0077c8;

}



table{

width:100%;

border-collapse:collapse;

margin-top:15px;

}



th{

background:#eef7ff;

}



th,
td{

padding:12px;

border-bottom:1px solid #ddd;

text-align:center;

}



button{

background:#0077c8;

color:white;

border:none;

padding:8px 15px;

border-radius:8px;

cursor:pointer;

}



button:hover{

background:#005fa3;

}



input,
textarea,
select{

width:100%;

box-sizing:border-box;

padding:12px;

margin-top:8px;

border:1px solid #ccc;

border-radius:8px;

}



textarea{

height:120px;

resize:none;

}



.form-row{

margin-top:15px;

}



.record{

background:#f8fbff;

padding:15px;

margin-top:15px;

border-radius:10px;

border-left:4px solid #0077c8;

}



.hidden{

display:none;

}



.success{

color:#008000;

text-align:center;

}



.error{

color:red;

text-align:center;

}


</style>


</head>
<body>


<div class="container">


<!-- 顶部 -->

<div class="header">


<div>


<div class="logo">

摆渡心理咨询师工作台

</div>


<div style="margin-top:8px">

当前咨询师：

<span id="consultantName">

涂老师

</span>

</div>


</div>



<button class="logout" onclick="logout()">

退出登录

</button>


</div>





<!-- 我的预约 -->

<div class="card">


<h2>

我的预约

</h2>



<button onclick="loadBookings()">

刷新预约

</button>



<table>


<thead>

<tr>

<th>
客户
</th>


<th>
电话
</th>


<th>
咨询类型
</th>


<th>
预约时间
</th>


<th>
状态
</th>


<th>
操作
</th>


</tr>

</thead>


<tbody id="bookingList">


<tr>

<td colspan="6">

正在加载...

</td>

</tr>


</tbody>


</table>



</div>





<!-- 咨询记录填写 -->


<div class="card hidden" id="recordBox">


<h2>

填写咨询记录

</h2>



<input 
type="hidden"
id="appointmentId">





<div class="form-row">


<label>

咨询标题

</label>


<input

id="recordTitle"

placeholder="例如：首次心理咨询">

</div>





<div class="form-row">


<label>

咨询内容

</label>


<textarea

id="recordContent"

placeholder="请输入本次咨询情况">

</textarea>


</div>





<div class="form-row">


<label>

客户情绪状态

</label>


<select id="recordMood">


<option>

平稳

</option>


<option>

焦虑

</option>


<option>

压力较大

</option>


<option>

情绪低落

</option>


<option>

其他

</option>


</select>


</div>





<div class="form-row">


<label>

风险等级

</label>


<select id="riskLevel">


<option>

低

</option>


<option>

中

</option>


<option>

高

</option>


</select>


</div>





<div class="form-row">


<label>

后续计划

</label>


<textarea

id="nextPlan"

placeholder="例如：一周后继续咨询">

</textarea>


</div>




<button onclick="saveRecord()">

保存咨询记录

</button>



<div id="saveResult">

</div>



</div>







<!-- 历史咨询记录 -->


<div class="card">


<h2>

咨询记录

</h2>



<div id="recordList">


暂无记录

</div>



</div>



</div>

<script>


// ======================================
// 当前咨询师
// ======================================


let consultantName = "涂老师";



// 当前预约ID

let currentAppointmentId = null;




// ======================================
// 页面初始化
// ======================================


window.onload = function(){


    loadBookings();

    loadRecords();


};




// ======================================
// 获取预约
// /api/consultant-bookings
// ======================================


async function loadBookings(){


try{


const res = await fetch(

"/api/consultant-bookings?name="
+
encodeURIComponent(consultantName)

);



const data = await res.json();



const list =
document.getElementById(
"bookingList"
);



if(!data.success || data.data.length===0){


list.innerHTML = `

<tr>

<td colspan="6">

暂无预约

</td>

</tr>

`;


return;


}





list.innerHTML="";



data.data.forEach(item=>{


let tr=document.createElement("tr");



tr.innerHTML=`

<td>
${item.name || "-"}
</td>


<td>
${item.phone || "-"}
</td>


<td>
${item.type || "-"}
</td>


<td>
${item.appointment_time || "-"}
</td>


<td>
${item.status || "待处理"}
</td>


<td>


<button

onclick="openRecord(${item.id})">

填写记录

</button>


</td>

`;



list.appendChild(tr);



});



}catch(e){


console.log(e);


document.getElementById(

"bookingList"

).innerHTML=`

<tr>

<td colspan="6">

加载失败

</td>

</tr>

`;



}



}






// ======================================
// 打开填写记录
// ======================================


function openRecord(id){


currentAppointmentId=id;



document.getElementById(
"appointmentId"
).value=id;



document.getElementById(
"recordBox"
).classList.remove(
"hidden"
);



window.scrollTo({

top:
document.getElementById(
"recordBox"
).offsetTop,

behavior:"smooth"

});



}







// ======================================
// 保存咨询记录
// POST /api/save-record
// ======================================


async function saveRecord(){



const result =
document.getElementById(
"saveResult"
);



result.innerHTML=
"正在保存...";





try{


const res =
await fetch(

"/api/save-record",

{


method:"POST",


headers:{


"Content-Type":

"application/json"


},


body:JSON.stringify({

appointment_id:

currentAppointmentId,


consultant:

consultantName,


title:

document.getElementById(
"recordTitle"
).value,


content:

document.getElementById(
"recordContent"
).value,


mood:

document.getElementById(
"recordMood"
).value,


risk_level:

document.getElementById(
"riskLevel"
).value,


next_plan:

document.getElementById(
"nextPlan"
).value


})


}

);




const data =
await res.json();





if(data.success){



result.className="success";


result.innerHTML=

"✅ 咨询记录保存成功";



// 清空

document.getElementById(
"recordTitle"
).value="";


document.getElementById(
"recordContent"
).value="";


document.getElementById(
"nextPlan"
).value="";



// 刷新记录

loadRecords();



}

else{


result.className="error";


result.innerHTML=

"保存失败："+data.message;


}



}catch(e){


result.className="error";


result.innerHTML=

"网络错误";


}



}







// ======================================
// 加载历史咨询记录
// GET /api/records
// ======================================


async function loadRecords(){


try{


const res =
await fetch(

"/api/records?consultant="

+
encodeURIComponent(
consultantName
)

);



const data =
await res.json();



const box =
document.getElementById(
"recordList"
);



if(
!data.success ||
data.data.length===0
){


box.innerHTML=

"暂无咨询记录";


return;


}




box.innerHTML="";



data.data.forEach(record=>{


let div =
document.createElement(
"div"
);


div.className="record";



div.innerHTML=

`

<h3>

${record.title || "咨询记录"}

</h3>


<p>

<b>咨询师：</b>

${record.consultant}

</p>


<p>

<b>咨询内容：</b>

${record.content}

</p>


<p>

<b>情绪：</b>

${record.mood}

</p>


<p>

<b>风险等级：</b>

${record.risk_level}

</p>


<p>

<b>后续计划：</b>

${record.next_plan}

</p>


<p>

时间：

${record.created_at}

</p>

`;



box.appendChild(div);



});




}catch(e){


console.log(e);


}



}






// ======================================
// 退出登录
// ======================================


function logout(){


localStorage.removeItem(
"consultant"
);



window.location.href=

"/consultant-login";


}



</script>


</body>

</html>
