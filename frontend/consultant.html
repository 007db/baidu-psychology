<!doctype html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>摆渡心理咨询师工作台</title>


<style>

body{

margin:0;

background:#f3f9ff;

font-family:"Microsoft YaHei";

}


.header{

background:#0077c8;

color:white;

padding:20px;

display:flex;

justify-content:space-between;

}


.container{

padding:20px;

}


.card{

background:white;

padding:20px;

border-radius:15px;

margin-bottom:20px;

box-shadow:0 5px 20px #ddd;

}



table{

width:100%;

border-collapse:collapse;

}


th{

background:#0077c8;

color:white;

padding:12px;

}


td{

padding:12px;

border-bottom:1px solid #ddd;

text-align:center;

}


button{

background:#0077c8;

color:white;

border:0;

padding:8px 15px;

border-radius:6px;

}


</style>


</head>


<body>


<div class="header">

<div>
摆渡心理咨询师工作台
</div>


<div>

<span id="name"></span>

<button onclick="logout()">
退出
</button>

</div>


</div>



<div class="container">


<div class="card">

<h2>
我的预约
</h2>


<table>


<thead>

<tr>

<th>
客户
</th>

<th>
电话
</th>

<th>
类型
</th>

<th>
时间
</th>

<th>
状态
</th>

</tr>

</thead>


<tbody id="list">

</tbody>


</table>


</div>



<div class="card">

<h2>
咨询记录
</h2>


<p>

后续添加咨询记录功能

</p>


</div>



</div>



<script>


const consultant =

JSON.parse(

localStorage.getItem("consultant")

);



if(!consultant){

location.href="/consultant-login";

}



document
.getElementById("name")
.innerHTML=

consultant.name;



async function load(){


const res=

await fetch(

"/api/consultant-bookings?name="+
encodeURIComponent(consultant.name)

);



const data=

await res.json();



const list=

document.getElementById("list");



list.innerHTML="";



if(data.success){


data.data.forEach(item=>{


list.innerHTML+=`

<tr>

<td>${item.name}</td>

<td>${item.phone}</td>

<td>${item.type}</td>

<td>${item.appointment_time}</td>

<td>${item.status}</td>

</tr>

`;


});


}



}



function logout(){


localStorage.removeItem("consultant");

location.href="/consultant-login";


}



load();


</script>


</body>

</html>
