<!doctype html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>摆渡心理管理后台</title>


<style>

body{

margin:0;

font-family:"Microsoft YaHei",Arial;

background:#f3f9ff;

}


.header{

background:#0077c8;

color:white;

padding:18px 25px;

display:flex;

justify-content:space-between;

align-items:center;

font-size:18px;

}



.header button{

background:white;

color:#0077c8;

border:none;

padding:6px 12px;

border-radius:6px;

cursor:pointer;

}



.container{

padding:20px;

max-width:1400px;

margin:auto;

}



.stats{

display:grid;

grid-template-columns:repeat(4,1fr);

gap:20px;

margin-bottom:20px;

}



.card{

background:white;

border-radius:15px;

padding:20px;

box-shadow:0 5px 20px rgba(0,0,0,.08);

}



.stat{

text-align:center;

font-size:18px;

color:#555;

}



.stat span{

display:block;

font-size:32px;

font-weight:bold;

color:#0077c8;

margin-top:10px;

}



.toolbar{

margin-bottom:15px;

}



.toolbar button{

background:#0077c8;

color:white;

border:none;

padding:10px 18px;

border-radius:8px;

cursor:pointer;

font-size:15px;

}



table{

width:100%;

background:white;

border-collapse:collapse;

border-radius:12px;

overflow:hidden;

}



th{

background:#0077c8;

color:white;

padding:12px;

}



td{

padding:12px;

border-bottom:1px solid #eee;

text-align:center;

}



select{

padding:6px;

border-radius:6px;

border:1px solid #ccc;

}



.finish{

background:#00a86b;

color:white;

border:none;

padding:6px 10px;

border-radius:6px;

cursor:pointer;

}



.delete{

background:#e53935;

color:white;

border:none;

padding:6px 10px;

border-radius:6px;

cursor:pointer;

}



@media(max-width:900px){


.stats{

grid-template-columns:repeat(2,1fr);

}


table{

font-size:13px;

}


}



</style>

</head>



<body>


<div class="header">


<div>

摆渡心理 商业管理中心

</div>


<div>

管理员：

<span id="username"></span>


<button onclick="logout()">

退出

</button>


</div>


</div>



<div class="container">



<div class="stats">


<div class="card stat">

今日预约

<span id="today">

0

</span>

</div>



<div class="card stat">

全部预约

<span id="total">

0

</span>

</div>



<div class="card stat">

待处理

<span id="pending">

0

</span>

</div>



<div class="card stat">

已完成

<span id="completed">

0

</span>

</div>


</div>




<div class="card">


<div class="toolbar">


<a href="/api/export">

<button>

📥 导出预约数据

</button>

</a>


</div>



<h2>

预约管理

</h2>



<table>


<thead>

<tr>

<th>姓名</th>

<th>电话</th>

<th>微信</th>

<th>类型</th>

<th>预约时间</th>

<th>留言</th>

<th>状态</th>

<th>操作</th>

</tr>

</thead>


<tbody id="list">


</tbody>


</table>


</div>


</div>





<script>


// 登录检查


const admin =

JSON.parse(

localStorage.getItem("admin")

);



if(!admin){

location.href="/admin-login";

}


document
.getElementById("username")
.innerHTML=

admin.username;



// 加载统计


async function dashboard(){


const res=

await fetch("/api/dashboard");


const data=

await res.json();



if(data.success){


today.innerHTML=

data.data.today;


total.innerHTML=

data.data.total;


pending.innerHTML=

data.data.pending;


completed.innerHTML=

data.data.completed;


}


}




// 加载预约


async function load(){


const res=

await fetch("/api/admin");


const data=

await res.json();



const list=

document.getElementById("list");


list.innerHTML="";



if(!data.success){

return;

}



data.data.forEach(item=>{


list.innerHTML +=`


<tr>


<td>${item.name || ""}</td>


<td>${item.phone || ""}</td>


<td>${item.wechat || ""}</td>


<td>${item.type || ""}</td>


<td>${item.appointment_time || ""}</td>


<td>${item.message || ""}</td>



<td>


<select onchange="changeStatus(${item.id},this.value)">



<option ${item.status=="待处理"?"selected":""}>

待处理

</option>



<option ${item.status=="已联系"?"selected":""}>

已联系

</option>



<option ${item.status=="预约确认"?"selected":""}>

预约确认

</option>



<option ${item.status=="咨询中"?"selected":""}>

咨询中

</option>



<option ${item.status=="已完成"?"selected":""}>

已完成

</option>



<option ${item.status=="取消"?"selected":""}>

取消

</option>



</select>



</td>



<td>


<button class="finish"

onclick="finish(${item.id})">

完成

</button>



<button class="delete"

onclick="removeItem(${item.id})">

删除

</button>



</td>



</tr>


`;


});


}



// 修改状态


async function changeStatus(id,status){


await fetch(

"/api/update-status",

{


method:"POST",

headers:{

"Content-Type":"application/json"

},


body:JSON.stringify({

id,

status

})


});


dashboard();

load();


}





// 快速完成


function finish(id){


changeStatus(id,"已完成");


}




// 删除


async function removeItem(id){


if(!confirm("确定删除该预约？")){

return;

}



await fetch(

"/api/delete-booking",

{


method:"POST",

headers:{

"Content-Type":"application/json"

},


body:JSON.stringify({

id

})


});


dashboard();

load();


}




//退出

function logout(){


localStorage.removeItem("admin");


location.href="/admin-login";


}



dashboard();

load();



</script>



</body>

</html>
