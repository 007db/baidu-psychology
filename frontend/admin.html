<!doctype html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>摆渡心理管理后台</title>


<style>

body{

margin:0;

font-family:"Microsoft YaHei";

background:#f3f9ff;

}


.header{

background:#0077c8;

color:white;

padding:20px;

display:flex;

justify-content:space-between;

align-items:center;

}


.container{

padding:20px;

}



.card{

background:white;

padding:20px;

border-radius:15px;

box-shadow:0 5px 20px rgba(0,0,0,.1);

margin-bottom:20px;

}



h2{

color:#0077c8;

}



table{

width:100%;

border-collapse:collapse;

}



th{

background:#0077c8;

color:white;

padding:12px;

}



td{

padding:10px;

border-bottom:1px solid #ddd;

text-align:center;

}



select{

padding:8px;

border-radius:6px;

border:1px solid #ccc;

}



button{

background:#0077c8;

color:white;

border:0;

padding:8px 15px;

border-radius:6px;

cursor:pointer;

}



button:hover{

background:#005fa3;

}



.msg{

text-align:center;

margin:15px;

color:green;

}



</style>

</head>



<body>



<div class="header">


<div>

<h2 style="color:white;margin:0">

摆渡心理管理中心

</h2>

</div>


<div>

管理员后台

</div>


</div>




<div class="container">



<div class="card">


<h2>

预约管理

</h2>



<div id="msg" class="msg"></div>



<table>


<thead>


<tr>


<th>
客户
</th>


<th>
电话
</th>


<th>
微信
</th>


<th>
咨询类型
</th>


<th>
预约时间
</th>


<th>
留言
</th>


<th>
状态
</th>


<th>
咨询师
</th>


<th>
操作
</th>


</tr>


</thead>



<tbody id="list">


</tbody>



</table>



</div>



</div>





<script>


let consultants=[];



//加载咨询师

async function loadConsultants(){


const res =
await fetch(
"/api/consultants"
);


const data =
await res.json();



if(data.success){

consultants=data.data;

}



}





//加载预约


async function loadBookings(){



const res =
await fetch(
"/api/appointments"
);



const data =
await res.json();



const list =
document.getElementById("list");



list.innerHTML="";



if(data.success){



data.data.forEach(item=>{


let options="";


consultants.forEach(c=>{


let selected="";


if(item.consultant===c.name){

selected="selected";

}


options +=`

<option value="${c.name}" ${selected}>

${c.name}

</option>

`;

});




list.innerHTML += `


<tr>


<td>
${item.name || ""}
</td>


<td>
${item.phone || ""}
</td>


<td>
${item.wechat || ""}
</td>


<td>
${item.type || ""}
</td>


<td>
${item.appointment_time || ""}
</td>


<td>
${item.message || ""}
</td>



<td>

${item.status || "待处理"}

</td>



<td>


<select id="c${item.id}">


<option value="">

未分配

</option>


${options}


</select>



</td>



<td>


<button onclick="assign(${item.id})">

分配

</button>



</td>


</tr>



`;



});


}


}






//分配咨询师


async function assign(id){



const consultant =

document.getElementById(
"c"+id
).value;




if(!consultant){


alert("请选择咨询师");

return;


}




const res =
await fetch(
"/api/assign-consultant",
{


method:"POST",


headers:{


"Content-Type":

"application/json"


},


body:JSON.stringify({


appointment_id:id,


consultant:consultant


})


});



const data =
await res.json();



if(data.success){



document.getElementById("msg").innerHTML=

"✅ 分配成功";



loadBookings();


}

else{


alert(
data.message
);


}



}






async function init(){


await loadConsultants();


await loadBookings();


}




init();



</script>




</body>

</html>
