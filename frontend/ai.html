<!doctype html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>摆渡心理 AI助手</title>


<style>

body {

  margin: 0;

  font-family:
    "Microsoft YaHei",
    Arial,
    sans-serif;

  background: #f3f9ff;

}


.container {

  max-width: 700px;

  margin: 30px auto;

  padding: 20px;

}


.logo-title {

  text-align: center;

  color: #0077c8;

  font-size: 28px;

  font-weight: bold;

}


.subtitle {

  text-align: center;

  color: #555;

  margin-bottom: 20px;

}


.chat-box {

  background: white;

  border-radius: 15px;

  padding: 20px;

  min-height: 350px;

  max-height: 600px;

  box-shadow:
    0 5px 20px rgba(0,0,0,.08);

  overflow-y: auto;

  box-sizing: border-box;

}


.user {

  text-align: right;

  margin: 12px 0;

}


.user span {

  display: inline-block;

  background: #0077c8;

  color: white;

  padding: 10px 15px;

  border-radius: 15px;

  max-width: 80%;

  text-align: left;

  word-break: break-word;

  white-space: pre-wrap;

}


.ai {

  text-align: left;

  margin: 12px 0;

}


.ai span {

  display: inline-block;

  background: #e8f5ff;

  color: #333;

  padding: 10px 15px;

  border-radius: 15px;

  max-width: 80%;

  text-align: left;

  word-break: break-word;

  white-space: pre-wrap;

}


.input-area {

  display: flex;

  margin-top: 15px;

  gap: 10px;

}


textarea {

  flex: 1;

  height: 70px;

  border-radius: 10px;

  border: 1px solid #ccc;

  padding: 10px;

  font-size: 15px;

  resize: none;

  box-sizing: border-box;

  font-family:
    "Microsoft YaHei",
    Arial,
    sans-serif;

}


button {

  width: 90px;

  background: #0077c8;

  color: white;

  border: none;

  border-radius: 10px;

  font-size: 16px;

  cursor: pointer;

}


button:hover {

  background: #005fa3;

}


button:disabled {

  background: #9bbfd5;

  cursor: not-allowed;

}


.end-button {

  width: 100%;

  margin-top: 15px;

  background: #5f7d8c;

}


.end-button:hover {

  background: #4d6875;

}


.hotline {

  margin-top: 25px;

  text-align: center;

  font-size: 16px;

}


.hotline a {

  color: #e53935;

  font-weight: bold;

  text-decoration: none;

}


.notice {

  margin-top: 15px;

  padding: 12px 15px;

  background: #f5f5f5;

  border-radius: 10px;

  color: #777;

  font-size: 13px;

  line-height: 1.6;

  text-align: center;

}


.status {

  text-align: center;

  margin-top: 10px;

  font-size: 14px;

  color: #0077c8;

}


.error {

  color: #d32f2f;

}


.success {

  color: #2e7d32;

}


@media (max-width:600px) {

  .container {

    margin: 10px auto;

    padding: 12px;

  }


  .logo-title {

    font-size: 24px;

  }


  .chat-box {

    min-height: 380px;

    padding: 15px;

  }


  .input-area {

    gap: 8px;

  }


  button {

    width: 75px;

  }

}

</style>

</head>


<body>


<div class="container">


  <div class="logo-title">

    摆渡心理 AI心理助手

  </div>


  <div class="subtitle">

    温暖陪伴 · 专业支持 · 安全交流

  </div>


  <div
    id="chat"
    class="chat-box"
  >

    <div class="ai">

      <span>
您好，我是摆渡心理AI助手。
<br>
您可以告诉我最近的情绪、压力或困扰。
      </span>

    </div>

  </div>


  <div class="input-area">

    <textarea
      id="msg"
      placeholder="请输入您的问题，例如：最近压力很大怎么办？"
    ></textarea>


    <button
      id="sendButton"
      onclick="send()"
    >

      发送

    </button>

  </div>


  <button
    id="endButton"
    class="end-button"
    onclick="endConversation()"
  >

    结束对话并发送记录

  </button>


  <div
    id="status"
    class="status"
  ></div>


  <div class="notice">

    AI助手提供的是一般性的心理支持，
    不能替代专业心理咨询或医疗诊断。

    <br>

    点击“结束对话并发送记录”后，
    本次聊天记录将发送到摆渡心理工作邮箱。

  </div>


  <div class="hotline">

    心理危机干预热线：

    <a href="tel:4000071995">
      400 007 1995
    </a>

  </div>


</div>


<script>


/* =====================================
   聊天记录
===================================== */

const chatHistory = [];


/* =====================================
   HTML安全转义
===================================== */

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text;

  return div.innerHTML;

}


/* =====================================
   显示消息
===================================== */

function addMessage(
  role,
  text
) {

  const chat =
    document.getElementById("chat");


  const div =
    document.createElement("div");


  div.className =
    role === "user"
      ? "user"
      : "ai";


  const span =
    document.createElement("span");


  span.textContent =
    text;


  div.appendChild(span);

  chat.appendChild(div);


  chat.scrollTop =
    chat.scrollHeight;

}


/* =====================================
   发送AI消息
===================================== */

async function send() {


  const input =
    document.getElementById("msg");


  const button =
    document.getElementById("sendButton");


  const endButton =
    document.getElementById("endButton");


  const chat =
    document.getElementById("chat");


  const status =
    document.getElementById("status");


  const text =
    input.value.trim();


  if (!text) {

    return;

  }


  /* 用户消息 */

  addMessage(
    "user",
    text
  );


  /* 保存用户消息 */

  chatHistory.push({

    role:
      "user",

    content:
      text

  });


  input.value = "";


  button.disabled = true;

  endButton.disabled = true;


  status.textContent =
    "AI正在思考...";


  status.className =
    "status";


  /* 加载 */

  const loading =
    document.createElement("div");


  loading.className =
    "ai";


  loading.id =
    "loading";


  loading.innerHTML =
    "<span>AI正在思考...</span>";


  chat.appendChild(
    loading
  );


  chat.scrollTop =
    chat.scrollHeight;


  try {


    const response =
      await fetch(
        "/api/ai",
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              message:
                text

            })

        }
      );


    const data =
      await response.json();


    const oldLoading =
      document.getElementById(
        "loading"
      );


    if (oldLoading) {

      oldLoading.remove();

    }


    if (
      !response.ok ||
      !data.success
    ) {

      throw new Error(
        data.error ||
        "AI服务暂时异常"
      );

    }


    const answer =
      data.reply ||
      "AI暂时没有回复";


    /* 显示AI */

    addMessage(
      "assistant",
      answer
    );


    /* 保存AI回复 */

    chatHistory.push({

      role:
        "assistant",

      content:
        answer

    });


    status.textContent =
      "";


  }
  catch (error) {


    const oldLoading =
      document.getElementById(
        "loading"
      );


    if (oldLoading) {

      oldLoading.remove();

    }


    addMessage(
      "assistant",
      "⚠️ " +
      (
        error?.message ||
        "AI服务暂时异常"
      )
    );


    status.textContent =
      "AI服务出现异常，请稍后再试。";


    status.className =
      "status error";

  }


  button.disabled =
    false;


  endButton.disabled =
    false;


  chat.scrollTop =
    chat.scrollHeight;

}


/* =====================================
   结束对话
===================================== */

async function endConversation() {


  const endButton =
    document.getElementById(
      "endButton"
    );


  const sendButton =
    document.getElementById(
      "sendButton"
    );


  const status =
    document.getElementById(
      "status"
    );


  /* 没有聊天记录 */

  if (
    chatHistory.length === 0
  ) {

    alert(
      "当前还没有聊天记录。"
    );

    return;

  }


  /* 用户确认 */

  const confirmed =
    confirm(
      "确定结束本次AI对话吗？\n\n" +
      "点击“确定”后，本次完整聊天记录将发送到摆渡心理工作邮箱。"
    );


  if (!confirmed) {

    return;

  }


  endButton.disabled =
    true;


  sendButton.disabled =
    true;


  status.textContent =
    "正在发送聊天记录...";


  status.className =
    "status";


  try {


    const response =
      await fetch(
        "/api/ai",
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              endConversation:
                true,

              history:
                chatHistory

            })

        }
      );


    const data =
      await response.json();


    if (
      !response.ok ||
      !data.success
    ) {

      throw new Error(
        data.error ||
        "聊天记录发送失败"
      );

    }


    /* =================================
       发送成功
    ================================= */

    status.textContent =
      "✅ 聊天记录已成功发送到工作邮箱";


    status.className =
      "status success";


    alert(
      "聊天记录已成功发送到摆渡心理工作邮箱。"
    );


    /*
     * 结束后不允许继续发送
     */

    sendButton.disabled =
      true;


    endButton.disabled =
      true;


  }
  catch (error) {


    console.error(
      "发送聊天记录失败:",
      error
    );


    status.textContent =
      "❌ " +
      (
        error?.message ||
        "聊天记录发送失败"
      );


    status.className =
      "status error";


    endButton.disabled =
      false;


    sendButton.disabled =
      false;


    alert(
      "聊天记录发送失败：\n" +
      (
        error?.message ||
        "未知错误"
      )
    );

  }

}


/* =====================================
   Enter发送
   Shift + Enter换行
===================================== */

document
  .getElementById("msg")
  .addEventListener(
    "keydown",
    function(e) {

      if (
        e.key === "Enter" &&
        !e.shiftKey
      ) {

        e.preventDefault();

        send();

      }

    }
  );


</script>


</body>

</html>
