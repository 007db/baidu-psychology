<!doctype html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>
摆渡心理 AI心理助手
</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

background:#f3f9ff;

font-family:
"Microsoft YaHei",
Arial,
sans-serif;

color:#333;

}


.container{

max-width:720px;

margin:30px auto;

padding:20px;

}



.logo{

text-align:center;

font-size:30px;

font-weight:bold;

color:#0077c8;

}



.subtitle{

text-align:center;

margin-top:10px;

margin-bottom:25px;

color:#666;

}



.chat-box{

background:white;

border-radius:18px;

padding:20px;

height:500px;

overflow-y:auto;

box-shadow:
0 5px 20px rgba(0,0,0,.08);

}



.user{

text-align:right;

margin:15px 0;

}



.user span{

display:inline-block;

background:#0077c8;

color:white;

padding:12px 16px;

border-radius:15px 15px 3px 15px;

max-width:85%;

white-space:pre-wrap;

}



.ai{

text-align:left;

margin:15px 0;

}



.ai span{

display:inline-block;

background:#e8f5ff;

padding:12px 16px;

border-radius:15px 15px 15px 3px;

max-width:85%;

white-space:pre-wrap;

}



.input-area{

display:flex;

gap:10px;

margin-top:15px;

}



textarea{

flex:1;

height:70px;

padding:12px;

border-radius:10px;

border:1px solid #ccc;

font-size:15px;

}



button{

width:90px;

border:none;

border-radius:10px;

background:#0077c8;

color:white;

font-size:16px;

cursor:pointer;

}


button:hover{

background:#005fa3;

}



.end-button{

width:100%;

margin-top:15px;

height:45px;

background:#555;

}



.end-button:hover{

background:#333;

}



.status{

text-align:center;

margin-top:12px;

font-size:14px;

color:#777;

}



.hotline{

text-align:center;

margin-top:25px;

}



.hotline a{

color:#e53935;

font-weight:bold;

text-decoration:none;

}



</style>

</head>


<body>


<div class="container">


<div class="logo">

摆渡心理 AI心理助手

</div>


<div class="subtitle">

温暖陪伴 · 专业支持 · 安全交流

</div>



<div id="chat"
class="chat-box">


<div class="ai">

<span>

您好，我是摆渡心理AI助手。

<br>

您可以告诉我最近的情绪、压力或困扰。

</span>

</div>


</div>



<div class="input-area">


<textarea
id="msg"
placeholder="请输入您的问题，例如：最近压力很大怎么办？">
</textarea>


<button
id="sendBtn"
onclick="sendMessage()">

发送

</button>


</div>



<button
id="endBtn"
class="end-button"
onclick="sendRecord()">

结束对话

</button>



<div id="status"
class="status">

</div>



<div class="hotline">

心理危机干预热线：

<a href="tel:4000071995">

400 007 1995

</a>

</div>


</div>


<script>
// ==========================================
// 聊天记录
// ==========================================

let history = [

{
role:"assistant",
content:
"您好，我是摆渡心理AI助手。\n您可以告诉我最近的情绪、压力或困扰。"
}

];


let ended = false;


// ==========================================
// HTML安全处理
// ==========================================

function escapeHtml(text){

return String(text)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}



// ==========================================
// 显示消息
// ==========================================

function addMessage(role,text){


const chat =
document.getElementById("chat");


if(role==="user"){


chat.innerHTML += `

<div class="user">

<span>

${escapeHtml(text)}

</span>

</div>

`;


}
else{


chat.innerHTML += `

<div class="ai">

<span>

${escapeHtml(text)}

</span>

</div>

`;

}



chat.scrollTop =
chat.scrollHeight;


}



// ==========================================
// AI聊天
// ==========================================

async function sendMessage(){


if(ended){

return;

}


const input =
document.getElementById("msg");


const sendBtn =
document.getElementById("sendBtn");


const text =
input.value.trim();



if(!text){

return;

}



addMessage(
"user",
text
);



history.push({

role:"user",

content:text

});



input.value="";


sendBtn.disabled=true;


document.getElementById("status")
.innerText=
"AI正在思考...";



try{


const response =
await fetch(
"/api/ai",
{

method:"POST",

headers:{

"Content-Type":
"application/json"

},


body:JSON.stringify({

message:text

})


}

);



const data =
await response.json();



if(
!response.ok ||
data.success===false
){


throw new Error(

data.error ||
"AI回复失败"

);


}



const reply =
data.reply || "";



history.push({

role:"assistant",

content:reply

});



addMessage(
"ai",
reply
);



document.getElementById("status")
.innerText="";



}

catch(error){


console.error(
error
);


addMessage(

"ai",

"AI服务暂时无法回复，请稍后再试。"

);


document.getElementById("status")
.innerText=
"服务异常";


}



sendBtn.disabled=false;


}



// ==========================================
// 结束聊天并发送邮箱
// ==========================================

async function sendRecord(){


if(ended){

return;

}



if(history.length<=1){


alert(
"当前还没有有效聊天记录"
);


return;

}



const ok =
confirm(

"确定结束本次对话，并发送聊天记录到工作邮箱吗？"

);



if(!ok){

return;

}



const btn =
document.getElementById("endBtn");


btn.disabled=true;


btn.innerText=
"正在发送聊天记录...";


document.getElementById("status")
.innerText=
"正在发送，请稍候...";



try{


// =================================
// 关键：这里调用 send-chat
// =================================


const response =
await fetch(

"/api/send-chat",

{


method:"POST",


headers:{

"Content-Type":
"application/json"

},


body:JSON.stringify({

history:history

})


}

);



const data =
await response.json();



console.log(
"发送结果:",
data
);



if(

response.ok &&
data.success===true

){


ended=true;


btn.innerText=
"聊天记录已发送";


document.getElementById("status")
.innerText=

"✓ 聊天记录已发送到工作邮箱";


alert(

"聊天记录发送成功！"

);



}

else{


throw new Error(

data.error ||
"发送失败"

);


}



}

catch(error){


console.error(
"发送邮件错误:",
error
);



btn.disabled=false;


btn.innerText=
"结束对话并发送记录";


document.getElementById("status")
.innerText=
"发送失败";



alert(

"聊天记录发送失败：\n\n"
+
error.message

);



}


}




// ==========================================
// Enter发送
// ==========================================


document

.getElementById("msg")

.addEventListener(

"keydown",

function(e){


if(

e.key==="Enter" &&
!e.shiftKey

){


e.preventDefault();


sendMessage();


}


}

);



</script>


</body>

</html>
