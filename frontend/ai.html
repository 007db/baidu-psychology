
<!doctype html>
<html lang='zh-CN'>
<head>
<meta charset='UTF-8'>
<title>摆渡心理 AI助手</title>
</head>
<body>
<h2>摆渡心理 AI心理助手 V10.1</h2>
<textarea id='msg'></textarea>
<button onclick='send()'>发送</button>
<div id='chat'></div>
<script>
let sessionId=localStorage.sessionId||crypto.randomUUID();
localStorage.sessionId=sessionId;

async function send(){
 let message=document.getElementById('msg').value;
 if(!message)return;
 let r=await fetch('/api/ai',{
 method:'POST',
 headers:{'Content-Type':'application/json'},
 body:JSON.stringify({message,sessionId})
 });
 let d=await r.json();
 document.getElementById('chat').innerHTML+=
 '<p>用户：'+message+'</p><p>AI：'+(d.reply||d.error)+'</p>';
}
</script>
</body>
</html>
