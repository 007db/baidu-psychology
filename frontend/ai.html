<!doctype html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>摆渡心理 AI助手</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  font-family:
    "Microsoft YaHei",
    Arial,
    sans-serif;

  background: #f3f9ff;

  color: #333;

}

.container {

  max-width: 700px;

  margin: 30px auto;

  padding: 20px;

}

.logo-title {

  text-align: center;

  color: #0077c8;

  font-size: 28px;

  font-weight: bold;

}

.subtitle {

  text-align: center;

  color: #666;

  margin-top: 8px;

  margin-bottom: 20px;

}


/* ==========================================
   聊天窗口
   ========================================== */

.chat-box {

  background: white;

  border-radius: 15px;

  padding: 20px;

  min-height: 350px;

  max-height: 600px;

  box-shadow:
    0 5px 20px rgba(0,0,0,.08);

  overflow-y: auto;

}


/* ==========================================
   用户消息
   ========================================== */

.user {

  text-align: right;

  margin: 14px 0;

}

.user span {

  display: inline-block;

  max-width: 85%;

  background: #0077c8;

  color: white;

  padding: 10px 15px;

  border-radius:
    15px 15px 3px 15px;

  white-space: pre-wrap;

  word-break: break-word;

}


/* ==========================================
   AI消息
   ========================================== */

.ai {

  text-align: left;

  margin: 14px 0;

}

.ai span {

  display: inline-block;

  max-width: 85%;

  background: #e8f5ff;

  color: #333;

  padding: 10px 15px;

  border-radius:
    15px 15px 15px 3px;

  white-space: pre-wrap;

  word-break: break-word;

}


/* ==========================================
   AI加载
   ========================================== */

.loading {

  color: #999;

}


/* ==========================================
   输入区域
   ========================================== */

.input-area {

  display: flex;

  margin-top: 15px;

  gap: 10px;

}

textarea {

  flex: 1;

  height: 70px;

  border-radius: 10px;

  border: 1px solid #ccc;

  padding: 10px;

  font-size: 15px;

  resize: none;

  outline: none;

  font-family:
    "Microsoft YaHei",
    Arial,
    sans-serif;

}

textarea:focus {

  border-color: #0077c8;

}


/* ==========================================
   发送按钮
   ========================================== */

button {

  width: 90px;

  background: #0077c8;

  color: white;

  border: none;

  border-radius: 10px;

  font-size: 16px;

  cursor: pointer;

}

button:hover {

  background: #005fa3;

}

button:disabled {

  background: #aaa;

  cursor: not-allowed;

}


/* ==========================================
   结束对话区域
   ========================================== */

.end-area {

  margin-top: 15px;

  text-align: center;

}

.end-button {

  width: 100%;

  max-width: 320px;

  height: 45px;

  background: #555;

  border-radius: 10px;

  font-size: 15px;

}

.end-button:hover {

  background: #333;

}


/* ==========================================
   状态信息
   ========================================== */

.status {

  margin-top: 12px;

  text-align: center;

  color: #777;

  font-size: 14px;

  min-height: 20px;

}


/* ==========================================
   危机热线
   ========================================== */

.hotline {

  margin-top: 25px;

  text-align: center;

  font-size: 16px;

}

.hotline a {

  color: #e53935;

  font-weight: bold;

  text-decoration: none;

}


/* ==========================================
   手机端
   ========================================== */

@media (max-width: 600px) {

  .container {

    margin: 10px auto;

    padding: 12px;

  }

  .logo-title {

    font-size: 24px;

  }

  .chat-box {

    min-height: 400px;

    padding: 15px;

  }

  .user span,
  .ai span {

    max-width: 90%;

  }

  .input-area {

    align-items: stretch;

  }

  textarea {

    height: 75px;

  }

  button {

    width: 80px;

  }

}

</style>

</head>


<body>


<div class="container">


  <!-- ========================================
       标题
       ======================================== -->

  <div class="logo-title">

    摆渡心理 AI心理助手

  </div>


  <div class="subtitle">

    温暖陪伴 · 专业支持 · 安全交流

  </div>


  <!-- ========================================
       聊天窗口
       ======================================== -->

  <div id="chat" class="chat-box">


    <div class="ai">

      <span>
您好，我是摆渡心理AI助手。
<br>
您可以告诉我最近的情绪、压力或困扰。
      </span>

    </div>


  </div>


  <!-- ========================================
       输入区域
       ======================================== -->

  <div class="input-area">


    <textarea
      id="msg"
      placeholder="请输入您的问题，例如：最近压力很大怎么办？"
    ></textarea>


    <button
      id="sendButton"
      onclick="send()"
    >
      发送
    </button>


  </div>


  <!-- ========================================
       结束对话
       ======================================== -->

  <div class="end-area">


    <button
      id="endButton"
      class="end-button"
      onclick="endConversation()"
    >
      结束对话并发送记录
    </button>


  </div>


  <!-- ========================================
       状态
       ======================================== -->

  <div
    id="status"
    class="status"
  ></div>


  <!-- ========================================
       心理危机热线
       ======================================== -->

  <div class="hotline">

    心理危机干预热线：

    <a href="tel:4000071995">
      400 007 1995
    </a>

  </div>


</div>



<script>


/* =====================================================
   聊天记录
   ===================================================== */

let history = [

  {

    role: "assistant",

    content:
      "您好，我是摆渡心理AI助手。\n您可以告诉我最近的情绪、压力或困扰。"

  }

];


let conversationEnded = false;


/* =====================================================
   HTML安全转义
   ===================================================== */

function escapeHtml(text) {

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   显示状态
   ===================================================== */

function setStatus(message) {

  const status =
    document.getElementById("status");

  if (status) {

    status.innerText =
      message || "";

  }

}


/* =====================================================
   发送AI消息
   ===================================================== */

async function send() {


  /* ========================================
     防止已经结束的对话继续发送
     ======================================== */

  if (conversationEnded) {

    return;

  }


  const input =
    document.getElementById("msg");


  const sendButton =
    document.getElementById("sendButton");


  const text =
    input.value.trim();


  if (!text) {

    return;

  }


  const chat =
    document.getElementById("chat");


  /* ========================================
     显示用户消息
     ======================================== */

  chat.innerHTML += `

    <div class="user">

      <span>
        ${escapeHtml(text)}
      </span>

    </div>

  `;


  /* ========================================
     保存用户消息
     ======================================== */

  history.push({

    role: "user",

    content: text

  });


  /* ========================================
     清空输入
     ======================================== */

  input.value = "";


  sendButton.disabled = true;


  setStatus(
    "AI正在思考..."
  );


  /* ========================================
     AI加载提示
     ======================================== */

  const loading =
    document.createElement("div");


  loading.className =
    "ai loading";


  loading.innerHTML =
    "<span>AI正在思考...</span>";


  chat.appendChild(
    loading
  );


  chat.scrollTop =
    chat.scrollHeight;


  try {


    /* ======================================
       调用 AI API

       注意：
       这里仍然是 /api/ai
       ====================================== */

    const response =
      await fetch(
        "/api/ai",
        {

          method: "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              message: text

            })

        }
      );


    /* ======================================
       读取返回数据
       ====================================== */

    const data =
      await response.json();


    loading.remove();


    /* ======================================
       API失败
       ====================================== */

    if (
      !response.ok ||
      data.success === false
    ) {


      const errorMessage =
        data.error ||
        "AI服务暂时无法回复，请稍后再试。";


      chat.innerHTML += `

        <div class="ai">

          <span>
            ${escapeHtml(errorMessage)}
          </span>

        </div>

      `;


      setStatus(
        "AI服务暂时异常"
      );


      sendButton.disabled = false;


      chat.scrollTop =
        chat.scrollHeight;


      return;

    }


    /* ======================================
       获取AI回复
       ====================================== */

    const answer =
      data.reply || "";


    if (!answer) {


      chat.innerHTML += `

        <div class="ai">

          <span>
            AI暂时没有返回内容，请稍后再试。
          </span>

        </div>

      `;


      setStatus(
        "AI暂时没有返回内容"
      );


      sendButton.disabled = false;


      return;

    }


    /* ======================================
       保存AI回复
       ====================================== */

    history.push({

      role: "assistant",

      content: answer

    });


    /* ======================================
       显示AI回复
       ====================================== */

    chat.innerHTML += `

      <div class="ai">

        <span>
          ${escapeHtml(answer)}
        </span>

      </div>

    `;


    setStatus(
      ""
    );


  }

  catch (error) {


    console.error(
      "AI请求失败:",
      error
    );


    loading.remove();


    chat.innerHTML += `

      <div class="ai">

        <span>
          连接AI服务失败，请稍后再试。
        </span>

      </div>

    `;


    setStatus(
      "连接AI服务失败"
    );

  }


  sendButton.disabled = false;


  chat.scrollTop =
    chat.scrollHeight;

}


/* =====================================================
   结束对话并发送完整聊天记录
   ===================================================== */

async function endConversation() {


  /* ========================================
     防止重复结束
     ======================================== */

  if (conversationEnded) {

    return;

  }


  /* ========================================
     至少需要一轮有效对话
     ======================================== */

  if (history.length <= 1) {

    alert(
      "当前还没有有效的聊天记录。"
    );

    return;

  }


  /* ========================================
     用户确认
     ======================================== */

  const confirmed =
    confirm(
      "确定结束本次对话并将完整聊天记录发送到工作邮箱吗？"
    );


  if (!confirmed) {

    return;

  }


  const endButton =
    document.getElementById("endButton");


  const sendButton =
    document.getElementById("sendButton");


  const input =
    document.getElementById("msg");


  /* ========================================
     禁止重复操作
     ======================================== */

  endButton.disabled = true;

  sendButton.disabled = true;

  input.disabled = true;


  endButton.innerText =
    "正在发送聊天记录...";


  setStatus(
    "正在将完整聊天记录发送到工作邮箱，请稍候..."
  );


  try {


    /* ======================================
       ★ 重点 ★

       聊天记录现在发送到：

       /api/send-chat

       不再发送到 /api/ai
       ====================================== */

    const response =
      await fetch(
        "/api/send-chat",
        {

          method: "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              history:
                history

            })

        }
      );


    /* ======================================
       读取返回数据
       ====================================== */

    const data =
      await response.json();


    console.log(
      "发送聊天记录返回:",
      data
    );


    /* ======================================
       邮件发送成功
       ====================================== */

    if (
      response.ok &&
      data.success === true
    ) {


      conversationEnded = true;


      endButton.innerText =
        "聊天记录已发送";


      setStatus(
        "✓ 本次聊天记录已成功发送到工作邮箱"
      );


      alert(
        "本次聊天记录已成功发送到工作邮箱！"
      );


    }

    else {


      /* ====================================
         邮件发送失败
         ==================================== */

      endButton.disabled = false;

      sendButton.disabled = false;

      input.disabled = false;


      endButton.innerText =
        "结束对话并发送记录";


      setStatus(
        "聊天记录发送失败"
      );


      alert(
        "聊天记录发送失败：\n\n" +
        (
          data.error ||
          "未知错误"
        )
      );


    }


  }

  catch (error) {


    console.error(
      "发送聊天记录失败:",
      error
    );


    endButton.disabled = false;

    sendButton.disabled = false;

    input.disabled = false;


    endButton.innerText =
      "结束对话并发送记录";


    setStatus(
      "聊天记录发送失败"
    );


    alert(
      "聊天记录发送失败，请稍后再试。\n\n" +
      (
        error?.message ||
        ""
      )
    );


  }

}


/* =====================================================
   Enter发送
   Enter = 发送
   Shift + Enter = 换行
   ===================================================== */

document
  .getElementById("msg")
  .addEventListener(
    "keydown",
    function(e) {


      if (
        e.key === "Enter" &&
        !e.shiftKey
      ) {


        e.preventDefault();


        send();


      }

    }
  );


</script>


</body>

</html>
