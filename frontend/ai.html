<!doctype html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>
摆渡心理 AI心理助手
</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

font-family:
"Microsoft YaHei",
Arial,
sans-serif;

background:
linear-gradient(
135deg,
#eef8ff,
#ffffff
);

}



.container{

max-width:760px;

margin:20px auto;

padding:20px;

}



/* 标题 */

.logo-title{

text-align:center;

font-size:30px;

font-weight:bold;

color:#0077c8;

}



.subtitle{

text-align:center;

margin-top:8px;

color:#666;

font-size:15px;

}



/* 聊天窗口 */

.chat-box{

margin-top:25px;

background:white;

border-radius:20px;

padding:20px;

height:520px;

overflow-y:auto;

box-shadow:

0 10px 30px
rgba(0,0,0,.08);

}



/* AI */

.ai{

text-align:left;

margin:15px 0;

}



.ai span{

display:inline-block;

background:#eaf6ff;

color:#333;

padding:14px 18px;

border-radius:

18px 18px 18px 4px;

max-width:85%;

line-height:1.7;

}



/* 用户 */

.user{

text-align:right;

margin:15px 0;

}



.user span{

display:inline-block;

background:#0077c8;

color:white;

padding:14px 18px;

border-radius:

18px 18px 4px 18px;

max-width:85%;

line-height:1.7;

}



/* 思考 */

.loading span{

color:#777;

}



.dot{

display:inline-block;

animation:
blink 1.4s infinite;

}



@keyframes blink{


0%{
opacity:.2;
}


50%{
opacity:1;
}


100%{
opacity:.2;
}


}



/* 输入区域 */


.input-area{

display:flex;

gap:10px;

margin-top:15px;

}



textarea{

flex:1;

height:75px;

border-radius:15px;

border:

1px solid #ccc;

padding:12px;

font-size:15px;

resize:none;

}



button{

width:100px;

border:none;

border-radius:15px;

background:#0077c8;

color:white;

font-size:16px;

cursor:pointer;

}



button:hover{

background:#005fa3;

}



button:disabled{

background:#aaa;

}




/* 状态 */

.status{

text-align:center;

margin-top:15px;

color:#666;

font-size:14px;

}



/* 提示 */

.notice{

margin-top:25px;

padding:15px;

background:#f7fbff;

border-radius:12px;

font-size:13px;

color:#777;

line-height:1.7;

}



.hotline{

margin-top:20px;

text-align:center;

}



.hotline a{

color:#e53935;

font-weight:bold;

text-decoration:none;

}




/* 手机 */

@media(max-width:600px){


.container{

padding:12px;

}


.logo-title{

font-size:24px;

}


.chat-box{

height:430px;

}



textarea{

height:60px;

}



button{

width:80px;

}


}



</style>

</head>



<body>


<div class="container">



<div class="logo-title">

摆渡心理 AI心理助手

</div>


<div class="subtitle">

温暖陪伴 · 专业支持 · 安全交流

</div>



<div id="chat"
class="chat-box">


<div class="ai">

<span>

您好，我是摆渡心理AI助手。

<br>

您可以告诉我最近的情绪、
压力或困扰。

</span>

</div>


</div>




<div class="input-area">


<textarea

id="msg"

placeholder="
请输入您的问题，例如：
最近压力很大怎么办？
">

</textarea>



<button

id="sendBtn"

onclick="send()">

发送

</button>


</div>



<div id="status"
class="status">

</div>



<div class="notice">

温馨提示：

<br>

AI助手提供心理支持和情绪陪伴，
不替代专业心理咨询。

<br>

如遇紧急情况，请及时寻求专业帮助。

</div>



<div class="hotline">

心理危机干预热线：

<a href="tel:4000071995">

400 007 1995

</a>


</div>



</div>
<script>


/*
==================================
摆渡心理 AI V10.2
自动邮件版
==================================
*/


// 聊天记录

let history = [

{
role:"assistant",

content:
"您好，我是摆渡心理AI助手。\n您可以告诉我最近的情绪、压力或困扰。"

}

];



// 自动发送计时器

let autoSendTimer = null;



// 是否已经发送

let mailSent=false;



// 自动发送时间

const AUTO_SEND_TIME = 10 * 60 * 1000;




/*
=============================
安全转义
=============================
*/


function escapeHtml(text){

return String(text)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}



/*
=============================
显示消息
=============================
*/


function addMessage(role,text){


const chat =
document.getElementById("chat");



if(role==="user"){


chat.innerHTML += `


<div class="user">

<span>

${escapeHtml(text)}

</span>

</div>


`;


}

else{


chat.innerHTML += `


<div class="ai">

<span>

${escapeHtml(text)}

</span>

</div>


`;

}



chat.scrollTop =
chat.scrollHeight;


}




/*
=============================
AI思考动画
=============================
*/


function showLoading(){


const chat =
document.getElementById("chat");



const div =
document.createElement("div");


div.id="loading";

div.className="ai loading";


div.innerHTML=`

<span>

AI正在思考

<span class="dot">●</span>
<span class="dot">●</span>
<span class="dot">●</span>


</span>

`;



chat.appendChild(div);


chat.scrollTop =
chat.scrollHeight;


}



function hideLoading(){


const loading =
document.getElementById("loading");


if(loading){

loading.remove();

}


}




/*
=============================
发送AI消息
=============================
*/


async function send(){


const input =
document.getElementById("msg");


const btn =
document.getElementById("sendBtn");



const text =
input.value.trim();



if(!text){

return;

}



if(mailSent){

alert(
"本次聊天记录已经发送。"
);

return;

}




// 显示用户

addMessage(
"user",
text
);



// 保存

history.push({

role:"user",

content:text

});



input.value="";



btn.disabled=true;



showLoading();




try{


const response =
await fetch(
"/api/ai",
{

method:"POST",

headers:{

"Content-Type":
"application/json"

},

body:JSON.stringify({

message:text

})

}

);



const data =
await response.json();



hideLoading();



if(

!response.ok ||

data.success===false

){


addMessage(

"assistant",

data.error ||
"AI服务异常"

);


}

else{


const reply =
data.reply || "";



history.push({

role:"assistant",

content:reply

});



addMessage(

"assistant",

reply

);


}




}

catch(error){


hideLoading();


console.error(error);



addMessage(

"assistant",

"连接AI服务失败，请稍后再试。"

);


}



btn.disabled=false;




// 每次聊天重新开始10分钟计时

startAutoTimer();



}





/*
=============================
10分钟自动邮件
=============================
*/


function startAutoTimer(){



if(mailSent){

return;

}



// 清除旧计时

if(autoSendTimer){

clearTimeout(autoSendTimer);

}




const status =
document.getElementById("status");



status.innerText=

"对话已保存，10分钟无操作后将自动发送记录";




autoSendTimer =
setTimeout(

()=>{


sendConversationMail();


},

AUTO_SEND_TIME

);


}





/*
=============================
发送聊天记录到邮箱
=============================
*/


async function sendConversationMail(){



if(mailSent){

return;

}



if(history.length<=1){

return;

}



const status =
document.getElementById("status");



status.innerText=

"正在安全发送聊天记录...";




try{


const response =
await fetch(

"/api/ai",

{


method:"POST",


headers:{

"Content-Type":

"application/json"

},


body:JSON.stringify({

endConversation:true,

history:history

})


}

);



const data =
await response.json();



console.log(

"自动邮件结果",

data

);



if(

response.ok &&

data.success===true

){


mailSent=true;



status.innerText=

"本次AI陪伴记录已发送到工作邮箱";


}

else{


status.innerText=

"邮件发送失败，请稍后重试";


}



}

catch(error){


console.error(

"自动邮件错误",

error

);



status.innerText=

"邮件发送异常";


}



}




/*
=============================
回车发送
=============================
*/


document

.getElementById("msg")

.addEventListener(

"keydown",

function(e){


if(

e.key==="Enter"

&&

!e.shiftKey

){


e.preventDefault();


send();


}


}

);



</script>


</body>

</html>
