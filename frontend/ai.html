<!doctype html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>摆渡心理 AI助手</title>

<style>

body {

  margin: 0;

  font-family:
    "Microsoft YaHei",
    Arial,
    sans-serif;

  background: #f3f9ff;

}


.container {

  max-width: 700px;

  margin: 30px auto;

  padding: 20px;

}


.logo-title {

  text-align: center;

  color: #0077c8;

  font-size: 28px;

  font-weight: bold;

}


.subtitle {

  text-align: center;

  color: #555;

  margin-bottom: 20px;

}


.chat-box {

  background: white;

  border-radius: 15px;

  padding: 20px;

  min-height: 350px;

  box-shadow:
    0 5px 20px rgba(0,0,0,.08);

  overflow-y: auto;

  box-sizing: border-box;

}


.user {

  text-align: right;

  margin: 12px 0;

}


.user span {

  display: inline-block;

  background: #0077c8;

  color: white;

  padding: 10px 15px;

  border-radius: 15px;

  max-width: 80%;

  text-align: left;

  word-break: break-word;

}


.ai {

  text-align: left;

  margin: 12px 0;

}


.ai span {

  display: inline-block;

  background: #e8f5ff;

  color: #333;

  padding: 10px 15px;

  border-radius: 15px;

  max-width: 80%;

  text-align: left;

  word-break: break-word;

  white-space: pre-wrap;

}


.input-area {

  display: flex;

  margin-top: 15px;

  gap: 10px;

}


textarea {

  flex: 1;

  height: 70px;

  border-radius: 10px;

  border: 1px solid #ccc;

  padding: 10px;

  font-size: 15px;

  resize: none;

  box-sizing: border-box;

  font-family:
    "Microsoft YaHei",
    Arial,
    sans-serif;

}


button {

  width: 90px;

  background: #0077c8;

  color: white;

  border: none;

  border-radius: 10px;

  font-size: 16px;

  cursor: pointer;

}


button:hover {

  background: #005fa3;

}


button:disabled {

  background: #9bbfd5;

  cursor: not-allowed;

}


.hotline {

  margin-top: 25px;

  text-align: center;

  font-size: 16px;

}


.hotline a {

  color: #e53935;

  font-weight: bold;

  text-decoration: none;

}


.loading {

  color: #999;

}


.error-message {

  background: #fff3f3 !important;

  color: #c62828 !important;

}


.notice {

  margin-top: 15px;

  padding: 10px 15px;

  background: #f5f5f5;

  border-radius: 10px;

  color: #777;

  font-size: 13px;

  line-height: 1.6;

  text-align: center;

}


@media (max-width: 600px) {

  .container {

    margin: 10px auto;

    padding: 12px;

  }


  .logo-title {

    font-size: 24px;

  }


  .chat-box {

    min-height: 380px;

    padding: 15px;

  }


  .input-area {

    gap: 8px;

  }


  textarea {

    height: 65px;

  }


  button {

    width: 75px;

  }

}

</style>

</head>


<body>


<div class="container">


  <div class="logo-title">

    摆渡心理 AI心理助手

  </div>


  <div class="subtitle">

    温暖陪伴 · 专业支持 · 安全交流

  </div>


  <div
    id="chat"
    class="chat-box"
  >

    <div class="ai">

      <span>
您好，我是摆渡心理AI助手。
<br>
您可以告诉我最近的情绪、压力或困扰。
      </span>

    </div>

  </div>


  <div class="input-area">

    <textarea
      id="msg"
      placeholder="请输入您的问题，例如：最近压力很大怎么办？"
    ></textarea>


    <button
      id="sendButton"
      onclick="send()"
    >
      发送
    </button>

  </div>


  <div class="notice">

    AI助手提供的是一般性的心理支持和信息，
    不能替代专业心理咨询或医疗诊断。
    <br>
    如遇紧急心理危机，请及时寻求专业帮助。

  </div>


  <div class="hotline">

    心理危机干预热线：

    <a href="tel:4000071995">
      400 007 1995
    </a>

  </div>


</div>


<script>


/* ================================
   防止用户输入内容直接当作 HTML
================================ */

function escapeHtml(text) {

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}


/* ================================
   发送消息
================================ */

async function send() {


  const input =
    document.getElementById("msg");


  const button =
    document.getElementById("sendButton");


  const chat =
    document.getElementById("chat");


  const text =
    input.value.trim();


  if (!text) {

    return;

  }


  /* ================================
     显示用户消息
  ================================= */

  chat.innerHTML += `

    <div class="user">

      <span>
        ${escapeHtml(text)}
      </span>

    </div>

  `;


  input.value = "";


  /* ================================
     禁止重复点击
  ================================= */

  button.disabled = true;

  button.textContent = "发送中";


  /* ================================
     AI加载提示
  ================================= */

  const loading =
    document.createElement("div");


  loading.className =
    "ai loading";


  loading.innerHTML =
    "<span>AI正在思考...</span>";


  chat.appendChild(loading);


  chat.scrollTop =
    chat.scrollHeight;


  try {


    /* ================================
       调用 Cloudflare Pages Function

       /api/ai
       ↓
       functions/api/ai.js
    ================================= */

    const response =
      await fetch(
        "/api/ai",
        {

          method: "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body: JSON.stringify({

            message: text

          })

        }
      );


    /* ================================
       尝试读取 JSON
    ================================= */

    let data;

    try {

      data =
        await response.json();

    } catch (jsonError) {

      throw new Error(
        "服务器返回的数据格式错误"
      );

    }


    /* 删除加载提示 */

    loading.remove();


    /* ================================
       HTTP错误
    ================================= */

    if (!response.ok) {

      const errorMessage =
        data?.error ||
        `服务器错误（HTTP ${response.status}）`;

      chat.innerHTML += `

        <div class="ai">

          <span class="error-message">

            ⚠️ ${escapeHtml(errorMessage)}

          </span>

        </div>

      `;

      return;

    }


    /* ================================
       新版 ai.js 返回格式：

       {
         success: true,
         reply: "AI回复内容"
       }
    ================================= */

    let answer = "";


    if (
      data &&
      data.success &&
      data.reply
    ) {

      answer =
        data.reply;

    }


    /* ================================
       兼容旧版 DeepSeek 返回格式

       防止旧接口暂时存在
    ================================= */

    else if (
      data &&
      data.choices &&
      data.choices[0] &&
      data.choices[0].message
    ) {

      answer =
        data.choices[0]
          .message
          .content || "";

    }


    /* ================================
       API返回错误
    ================================= */

    else if (
      data &&
      data.error
    ) {

      answer =
        "⚠️ " +
        data.error;

    }


    /* ================================
       没有任何回复
    ================================= */

    else {

      answer =
        "AI暂时无法回复，请稍后再试";

    }


    /* ================================
       显示AI回复
    ================================= */

    const isError =
      answer.startsWith("⚠️");


    chat.innerHTML += `

      <div class="ai">

        <span
          class="${isError ? "error-message" : ""}"
        >

          ${escapeHtml(answer)}

        </span>

      </div>

    `;


  } catch (error) {


    /* 删除加载提示 */

    loading.remove();


    console.error(
      "AI请求错误:",
      error
    );


    chat.innerHTML += `

      <div class="ai">

        <span class="error-message">

          ⚠️ 连接AI服务失败，请稍后再试。

          <br>

          <small>
            ${escapeHtml(
              error?.message || ""
            )}
          </small>

        </span>

      </div>

    `;

  }


  /* ================================
     恢复发送按钮
  ================================= */

  button.disabled = false;

  button.textContent = "发送";


  /* ================================
     滚动到底部
  ================================= */

  chat.scrollTop =
    chat.scrollHeight;

}


/* ================================
   Enter发送
   Shift + Enter换行
================================ */

document
  .getElementById("msg")
  .addEventListener(
    "keydown",
    function(e) {

      if (
        e.key === "Enter" &&
        !e.shiftKey
      ) {

        e.preventDefault();

        send();

      }

    }
  );

</script>


</body>

</html>
