<!DOCTYPE html>
<html><body>
<img src="/assets/logo.png" width="160">
<h1>AI心理助手</h1>
<textarea id="msg" rows="5" cols="40"></textarea>
<button onclick="chat()">发送</button>
<pre id="result"></pre>
<script>
async function chat(){
result.innerText="AI处理中...";
let r=await fetch('/api/ai',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({message:msg.value})
});
result.innerText=await r.text();
}
</script>
</body></html>
