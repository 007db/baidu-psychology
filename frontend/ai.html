<!DOCTYPE html>
<html><body>
<h1>DeepSeek AI心理助手</h1>
<textarea id="message" placeholder="请输入你的问题"></textarea>
<button onclick="ask()">发送</button>
<div id="result"></div>
<script>
async function ask(){
let r=await fetch('/api/ai',{
method:'POST',
headers:{'content-type':'application/json'},
body:JSON.stringify({message:message.value})
});
result.innerHTML=await r.text();
}
</script>
</body></html>
