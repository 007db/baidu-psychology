<!doctype html><html><body>
<h2>会员注册</h2>
<input id="name" placeholder="姓名">
<input id="phone" placeholder="手机号">
<input id="password" placeholder="密码">
<button onclick="go()">注册</button>
<script>
async function go(){
let r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value,phone:phone.value,password:password.value})});
alert(await r.text());
}
</script>
</body></html>
